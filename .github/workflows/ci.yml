name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --runInBand

  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run API unit tests
        run: ./mvnw test

  browser-and-api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Install Python test dependencies
        working-directory: tests
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        working-directory: tests
        run: python -m playwright install --with-deps chromium

      - name: Start API
        working-directory: api
        run: |
          ./mvnw spring-boot:run > ../api.log 2>&1 &

      - name: Wait for API
        run: |
          for i in {1..60}; do
            if curl -fsS "http://127.0.0.1:8080/posts?limit=1&skip=0" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat api.log
          exit 1

      - name: Start frontend
        working-directory: client
        env:
          NEXT_PUBLIC_BASE_URL: http://127.0.0.1:8080
          NEXT_DIST_DIR: .next-ci
        run: |
          npm run dev > ../client.log 2>&1 &

      - name: Wait for frontend
        run: |
          for i in {1..60}; do
            if curl -fsS "http://127.0.0.1:3000/signin" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat client.log
          exit 1

      - name: Run API and E2E tests
        working-directory: tests
        env:
          APP_BASE_URL: http://127.0.0.1:3000
          API_BASE_URL: http://127.0.0.1:8080
        run: pytest
