name: SQA Social Media - Pipeline de CI

# 1. GATILHO: A esteira vai rodar obrigatoriamente sempre que alguém abrir ou atualizar um Pull Request para a branch main
on:
  pull_request:
    branches: [ main ]

jobs:
  test-application:
    # Cria um computador virtual com Linux (Ubuntu) no servidor do GitHub
    runs-on: ubuntu-latest

    steps:
    # Passo 1: Baixa todo o código do seu repositório para dentro desse computador virtual
    - name: Checkout do código
      uses: actions/checkout@v4

    # Passo 2: Instala o Java JDK 17 (necessário para rodar o seu backend Spring Boot)
    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Passo 3: Instala o Node.js v20 (necessário para rodar o frontend Next.js e o Playwright)
    - name: Configurar Node.js v20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # Passo 4: Entra na pasta 'api', dá permissão para o Maven e compila o seu backend Java
    - name: Instalar dependências do Backend (API)
      run: |
        cd api
        chmod +x mvnw
        ./mvnw clean package -DskipTests

    # Passo 5: Entra na pasta 'client' e instala os pacotes do seu frontend Next.js
    - name: Instalar dependências do Frontend (Client)
      run: |
        cd client
        npm install

    # Passo 6: Entra na pasta 'testes', instala os pacotes e baixa os navegadores "fantasmas" do Playwright
    - name: Instalar dependências do Playwright
      run: |
        cd testes
        npm install
        npx playwright install --with-deps

    # Passo 7: O grande momento! Sobe os dois servidores em segundo plano, espera eles ligarem e roda os testes
    - name: Subir Aplicação e Executar Testes
      run: |
        # Liga o backend Spring Boot em segundo plano (o símbolo '&' serve para não travar o terminal)
        cd api
        ./mvnw spring-boot:run &
        
        # Liga o frontend Next.js em segundo plano
        cd ../client
        npm run dev &
        
        # O comando wait-on faz o computador do GitHub esperar até 1 minuto até que as portas 8080 e 3000 estejam respondendo
        cd ../testes
        npx wait-on http://localhost:8080 http://localhost:3000 --timeout 60000
        
        # Com tudo ligado, dispara a sua suíte de testes (os de API e E2E que deixamos verdinhos!)
        npx playwright test