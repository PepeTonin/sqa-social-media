name: CI Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  unit-tests-api:
    name: API Unit Tests (Maven + H2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run API unit tests
        working-directory: ./api
        run: ./mvnw test

  unit-tests-client:
    name: Client Unit Tests (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Run client unit tests
        working-directory: ./client
        run: npm test -- --passWithNoTests

  e2e-tests:
    name: E2E & API Integration Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [unit-tests-api, unit-tests-client]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: social_media
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            tests/package-lock.json

      - name: Build API
        working-directory: ./api
        run: ./mvnw package -DskipTests

      - name: Start API
        working-directory: ./api
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/social_media
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: |
          java -jar target/*.jar &
          echo "API_PID=$!" >> $GITHUB_ENV

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/posts > /dev/null 2>&1; then
              echo "API is up"
              break
            fi
            echo "Waiting for API... attempt $i"
            sleep 3
          done

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Build client
        working-directory: ./client
        run: npm run build

      - name: Start client
        working-directory: ./client
        run: |
          npm start &
          echo "CLIENT_PID=$!" >> $GITHUB_ENV

      - name: Wait for client to be ready
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Client is up"
              break
            fi
            echo "Waiting for client... attempt $i"
            sleep 3
          done

      - name: Install Playwright test dependencies
        working-directory: ./tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./tests
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (Chromium only)
        working-directory: ./tests
        run: npx playwright test --project=chromium
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7
